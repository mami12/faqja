<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Football board</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="bar">
  <div class="brand">FOOTBALL</div>
  <div class="counts" id="counts">live – / prematch –</div>
  <div class="status" id="status" data-state="off">connecting…</div>
</header>

<div class="controls">
  <div class="tabs" role="tablist">
    <button class="tab active" data-service="live">LIVE</button>
    <button class="tab" data-service="prematch">PREMATCH</button>
  </div>
  <select id="league"><option value="">all leagues</option></select>
  <input id="q" type="search" placeholder="team / league" autocomplete="off" />
  <select id="limit">
    <option value="100">100</option>
    <option value="300" selected>300</option>
    <option value="1000">1000</option>
  </select>
  <button id="reload" title="reload">↻</button>
  <span class="stamp" id="stamp"></span>
</div>

<div class="legend">
  <span><b>1 X 2</b> full time result</span>
  <span><b>O/U</b> total goals</span>
  <span><b>corners</b> total corners</span>
  <span><b>cards</b> total cards</span>
  <span class="susp">suspended</span>
</div>

<main>
  <table id="board">
    <thead>
      <tr>
        <th class="c-time">time</th>
        <th class="c-league">league</th>
        <th class="c-match">match</th>
        <th class="c-num" colspan="3">1 X 2</th>
        <th class="c-num" colspan="2">O/U</th>
        <th class="c-num" colspan="2">corners</th>
        <th class="c-num" colspan="2">cards</th>
      </tr>
      <tr class="sub">
        <th></th>
        <th></th>
        <th></th>
        <th>1</th><th>X</th><th>2</th>
        <th>O</th><th>U</th>
        <th>O</th><th>U</th>
        <th>O</th><th>U</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty">loading…</p>
</main>

<footer>
  <span id="foot-note">live minute is derived from kickoff (1H 0-45, HT, 2H 46-90).</span>
</footer>

<script src="vendor/socket.io.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
