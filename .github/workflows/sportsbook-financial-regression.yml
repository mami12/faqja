name: Sportsbook financial settlement verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  financial-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTENV_CONFIG_PATH: /dev/null
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/isolated_ci
      JWT_SECRET: isolated-ci-test-secret-only
      STATS_PROVIDERS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate LIVE and PREMATCH market conditions and event chronology
        run: |
          node scripts/test-live-contract-rules.mjs
          node scripts/test-primary-market-verification.mjs
          node scripts/test-prematch-market-verification.mjs
          node scripts/test-zizobet-partial-interval-evidence.mjs
          node scripts/test-zizobet-window-settlement.mjs
          node scripts/test-live-financial-safety.mjs
          node scripts/test-zizobet-info-history.mjs
          node scripts/test-whole-line-sportsbook-push.mjs
          node scripts/test-provider-event-facts-sql.mjs
          node scripts/test-persisted-primary-confirmation.mjs
          node scripts/test-zizobet-card-colors-scorers.mjs
      - name: Verify two PRIMARY polls, outages, recovery and one wallet credit
        run: |
          node scripts/test-verified-live-settlement.mjs
          node scripts/test-live-settlement-money-flow.mjs
          node scripts/test-live-observation-recovery.mjs
      - name: Syntax check deployment read-only Zizobet incident audit
        run: node --check scripts/audit-zizobet-provider-evidence.mjs
      - name: Verify virtual market lab and real-money restrictions
        run: |
          node scripts/test-live-market-lab.mjs
          node scripts/test-real-market-lab.mjs
      - name: Verify sports settlements, builder and financial risk controls
        run: |
          node scripts/test-live-risk.mjs
          node scripts/test-live-money-risk.mjs
          node scripts/test-mixed-combos.mjs
          node scripts/test-bet-builder.mjs
          node scripts/test-settlement-results.mjs
          node scripts/test-market-expiry.mjs
