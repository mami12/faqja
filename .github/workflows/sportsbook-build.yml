name: Verify sportsbook build

on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/test-casino-art.mjs'
      - 'server/**'
      - 'scripts/test-live-risk.mjs'
      - 'scripts/test-live-money-risk.mjs'
      - 'scripts/test-mixed-combos.mjs'
      - 'scripts/test-sportsbook-labels.mjs'
      - 'scripts/test-market-identity.mjs'
      - 'scripts/test-bet-builder.mjs'
      - 'scripts/test-settlement-results.mjs'
      - 'scripts/test-market-expiry.mjs'
      - 'scripts/test-mobile-betslip-badge.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sportsbook-build.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/test-sportsbook-labels.mjs'
      - 'scripts/test-mixed-combos.mjs'
      - 'scripts/test-bet-builder.mjs'
      - 'scripts/test-settlement-results.mjs'
      - '.github/workflows/sportsbook-build.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Validate sportsbook label regressions
        run: npm run test:sportsbook-labels
      - name: Validate market identities and unknown-market exclusions
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: node scripts/test-market-identity.mjs
      - name: Validate server risk suspensions
        run: node scripts/test-live-risk.mjs
      - name: Validate live financial risk limits
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: node scripts/test-live-money-risk.mjs
      - name: Validate mixed market contracts and settlement
        run: node scripts/test-mixed-combos.mjs
      - name: Validate universal builder contracts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: node scripts/test-bet-builder.mjs
      - name: Validate result settlement and player betting-history filters
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: node scripts/test-settlement-results.mjs
      - name: Validate decided live-market visibility
        run: node scripts/test-market-expiry.mjs
      - name: Validate mobile match-count badge
        run: node scripts/test-mobile-betslip-badge.mjs
      - name: Verify all original casino game artwork
        run: node scripts/test-casino-art.mjs
      - name: Typecheck frontend
        run: npm --prefix web run typecheck
      - name: Check backend syntax
        run: |
          node --check server/push-decode.mjs
          node --check server/collector.mjs
          node --check server/live-risk.mjs
          node --check server/live-risk-settings.mjs
          node --check server/ledger/live-risk-store.mjs
          node --check server/ledger/bet-risk.mjs
          node --check server/index.mjs
          node --check server/ledger/bets.mjs
          node --check server/ledger/bet-history.mjs
          node --check server/ledger/results.mjs
          node --check server/ledger/settler.mjs
          node --check server/ledger/routes.mjs
          node --check server/ledger/decided-markets.mjs
          node --check server/ledger/view.mjs
          node --check server/casino/sizzling-demo.mjs
          node --check server/casino/wallet.mjs
          node --check server/casino/finance.mjs
          node --check server/casino/transactions.mjs
          node --check server/casino/rtp-profiles.mjs
          node --check server/casino/sizzling-real.mjs
      - name: Build Vite frontend
        run: npm run build:web
      - name: Validate Sizzling RTP profiles and reel math
        run: node scripts/test-casino-math.mjs
      - name: Verify original Sizzling demo protocol and Goldsvet math
        run: node scripts/test-sizzling-demo.mjs
      - name: Browser-smoke test original Sizzling Pixi client
        run: node scripts/test-sizzling-browser.mjs
      - name: Preserve Sizzling original screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sizzling-original-browser
          path: tmp/sizzling-browser-check/*.png
          if-no-files-found: ignore


  casino-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: test
          POSTGRES_DB: casino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casino -d casino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify real casino and sportsbook wallet transactions in disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://casino:test@localhost:5432/casino_test
          CASINO_REAL_MONEY_ENABLED: 'true'
          CASINO_MATH_APPROVED: 'true'
        run: node scripts/test-casino-ledger.mjs
