name: Verify sportsbook build

on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/test-sportsbook-labels.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sportsbook-build.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/test-sportsbook-labels.mjs'
      - '.github/workflows/sportsbook-build.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Validate sportsbook label regressions
        run: npm run test:sportsbook-labels
      - name: Build Vite frontend
        run: npm run build:web
