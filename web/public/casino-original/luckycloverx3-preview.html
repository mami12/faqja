<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky Clover X3 Asset Preview</title><style>body{margin:0;background:#14230d;color:#ffe7a0;font:16px system-ui;text-align:center}main{max-width:800px;margin:auto;padding:16px}.frame{border:5px solid #c79e44;border-radius:16px;background:#293b1a;padding:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.reel{display:grid;gap:6px}.reel img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff8dd;border-radius:6px}button{padding:14px 30px;margin:15px;background:#e6b849;border:0;border-radius:9px;font-weight:800;font-size:18px}.busy img{filter:blur(3px)}p{font-size:13px}</style></head><body><main><h1>Lucky Clover X3</h1><p>Original artwork viewer · animation preview · no wagering</p><div class="frame"><div class="grid" id="grid"></div><button id="spin">Preview animation</button></div></main><script>const root='/app/casino-original/luckycloverx3/html-interface-stable/1024/games/LuckyCloverX3/game/main/';const grid=document.getElementById('grid');let busy=false;function render(){grid.replaceChildren();for(let c=0;c<5;c++){const reel=document.createElement('div');reel.className='reel';for(let r=0;r<3;r++){const img=document.createElement('img');img.src=root+'sym_'+String(1+Math.floor(Math.random()*11)).padStart(2,'0')+'.webp';img.alt='Game symbol';reel.append(img)}grid.append(reel)}}document.getElementById('spin').onclick=()=>{if(busy)return;busy=true;grid.classList.add('busy');setTimeout(()=>{render();grid.classList.remove('busy');busy=false},600)};render()</script></body></html>
